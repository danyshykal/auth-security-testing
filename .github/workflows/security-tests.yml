name: Auth Security Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt

      - name: Secure mode - every test must pass
        run: pytest

      - name: Vulnerable mode - the suite must catch the flaws (tests are expected to fail)
        run: "! pytest --vulnerable -q --html=reports/vulnerable-report.html --self-contained-html"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-test-reports
          path: reports/
